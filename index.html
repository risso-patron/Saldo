    <!-- RC-1.1 — aplica la clase de tema antes del primer paint para evitar
         un flash del tema equivocado al recargar. Misma lógica que
         getInitialTheme en src/contexts/ThemeContext.jsx (debe ejecutarse
         acá también porque corre antes de que React monte). -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
